<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}minimise{% endblock %}</title>
    <script>
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-header">
        <h1><a href="{{ url_for('job_list_page') }}" style="border:none;">minimise</a></h1>
        <button type="button" class="toggle-btn" id="theme-toggle">theme</button>
    </div>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='poll.js') }}"></script>
    <script>
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
            document.documentElement.dataset.theme = next;
            localStorage.setItem('theme', next);
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
